    </g>
    <rect class="card" x="18" y="520" rx="20" width="324" height="94"/>
    <text x="318" y="551" text-anchor="end" class="h2 ink">طلبك النشط</text><rect class="soft" x="38" y="537" rx="12" width="82" height="26"/><text x="79" y="555" text-anchor="middle" class="caption ink">جاري المطابقة</text><text x="318" y="582" text-anchor="end" class="body muted">إصلاح تسريب أسفل المغسلة</text>

    <rect class="card" x="0" y="684" width="360" height="76"/>
    <g class="caption muted" text-anchor="middle"><text x="45" y="734">الحساب</text><text x="135" y="734">الرسائل</text><text x="225" y="734">طلباتي</text><text x="315" y="734" fill="#2E8C7A">الرئيسية</text></g>
    <g fill="#5D706D"><circle cx="45" cy="706" r="9"/><rect x="126" y="698" width="18" height="15" rx="5"/><rect x="216" y="697" width="18" height="19" rx="3"/><path d="M303 707l12-10 12 10v14h-24z" fill="#2E8C7A"/></g>
