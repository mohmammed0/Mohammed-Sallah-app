<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="840" viewBox="0 0 1160 840" role="img" aria-labelledby="title desc">
  <title id="title">Sallah customer experience v1 design reference</title>
  <desc id="desc">Original Arabic-first reference showing home, AI chat and location picker screens. This is not a physical-device screenshot.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102A2A" flood-opacity=".12"/>
    </filter>
    <style>
      .frame{fill:#F7F8F5;stroke:#C8D5D1;stroke-width:2}
      .card{fill:#FFFFFF;stroke:#D9E3DF;stroke-width:1}
      .soft{fill:#DFF2EE}.accent{fill:#FFF2D8}.primary{fill:#2E8C7A}
      .ink{fill:#102A2A}.muted{fill:#5D706D}.white{fill:#FFFFFF}
      .title{font:900 25px Arial;direction:rtl;unicode-bidi:bidi-override}
      .h2{font:800 17px Arial;direction:rtl;unicode-bidi:bidi-override}
      .body{font:500 13px Arial;direction:rtl;unicode-bidi:bidi-override}
      .caption{font:600 11px Arial;direction:rtl;unicode-bidi:bidi-override}
      .latin{font:600 12px Arial}
    </style>
  </defs>
  <rect width="1160" height="840" fill="#EDF3F0"/>
  <text x="580" y="30" text-anchor="middle" class="latin ink">SALLAH CUSTOMER EXPERIENCE V1 · ORIGINAL DESIGN REFERENCE · NOT A DEVICE CAPTURE</text>

