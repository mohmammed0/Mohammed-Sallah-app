    <rect class="soft" x="18" y="102" rx="25" width="324" height="146"/>
    <circle class="accent" cx="300" cy="138" r="23"/><path d="M292 138l6 6 11-14" fill="none" stroke="#9A5B05" stroke-width="3"/>
