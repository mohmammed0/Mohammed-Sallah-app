    <rect class="primary" x="122" y="240" rx="20" width="202" height="64"/><text x="300" y="266" text-anchor="end" class="caption white">أنت</text><text x="300" y="287" text-anchor="end" class="body white">ضغط الماء منخفض من اليوم</text>
