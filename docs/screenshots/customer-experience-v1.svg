    <rect class="card" x="18" y="500" rx="22" width="324" height="168"/>
    <text x="318" y="534" text-anchor="end" class="body muted">اكتب إجابتك هنا...</text>
    <line x1="34" y1="556" x2="326" y2="556" stroke="#D9E3DF"/>
    <g transform="translate(40 574)"><circle class="soft" cx="20" cy="20" r="20"/><path d="M14 18h12v10H14z" fill="none" stroke="#2E8C7A" stroke-width="2"/><circle class="soft" cx="82" cy="20" r="20"/><path d="M75 14h14v12H75z" fill="none" stroke="#2E8C7A" stroke-width="2"/><circle class="soft" cx="144" cy="20" r="20"/><path d="M144 10v20M137 20a7 7 0 0 0 14 0" stroke="#2E8C7A" stroke-width="2" fill="none"/><circle class="primary" cx="260" cy="20" r="22"/><path d="M250 20h17M261 13l7 7-7 7" stroke="#fff" stroke-width="2" fill="none"/></g>
    <text x="180" y="716" text-anchor="middle" class="caption muted">المسودة محفوظة ويمكن استكمالها لاحقًا</text>
  </g>

  <g transform="translate(778 48)" filter="url(#shadow)">
    <rect class="frame" rx="34" width="360" height="760"/>
    <text x="320" y="48" text-anchor="end" class="title ink">حدد موقع الخدمة</text>
