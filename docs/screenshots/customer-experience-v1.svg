    <text x="318" y="308" text-anchor="end" class="body muted">ابحث عن خدمة</text>
    <circle cx="46" cy="302" r="8" fill="none" stroke="#5D706D" stroke-width="2"/><path d="M52 308l7 7" stroke="#5D706D" stroke-width="2"/>

