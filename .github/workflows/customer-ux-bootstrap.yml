name: Customer UX cloud bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/customer-experience-redesign-v1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Add Expo-compatible icon runtime
        run: pnpm --filter @sallah/mobile add --save-exact lucide-react-native@1.18.0 react-native-svg@15.15.4
      - name: Create forward-only migration
        run: pnpm exec supabase migration new customer_saved_locations
      - name: Commit generated dependency and migration state
        env:
          TARGET_BRANCH: codex/customer-experience-redesign-v1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/customer-ux-bootstrap.yml
          git add apps/mobile/package.json pnpm-lock.yaml supabase/migrations
          git commit -m "chore(mobile): bootstrap customer UX dependencies"
          git push origin "HEAD:${TARGET_BRANCH}"
