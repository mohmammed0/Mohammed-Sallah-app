name: Cloud format Android startup hotfix

on:
  push:
    branches:
      - codex/fix-android-startup-loading

permissions:
  contents: write

concurrency:
  group: cloud-format-android-startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format only hotfix files
        run: |
          pnpm exec prettier --write \
            apps/mobile/app/_layout.tsx \
            apps/mobile/src/features/auth/startup-recovery-screen.tsx \
            apps/mobile/src/lib/secure-storage.ts \
            apps/mobile/src/providers/session-bootstrap.ts \
            apps/mobile/src/providers/session-provider.tsx \
            apps/mobile/test/secure-storage.test.ts \
            apps/mobile/test/session-bootstrap.test.ts \
            apps/mobile/test/startup-recovery.test.tsx \
            docs/release/ANDROID_STARTUP_RECOVERY.md \
            packages/i18n/src/index.ts
          git diff --check
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Hotfix files already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/mobile/app/_layout.tsx \
            apps/mobile/src/features/auth/startup-recovery-screen.tsx \
            apps/mobile/src/lib/secure-storage.ts \
            apps/mobile/src/providers/session-bootstrap.ts \
            apps/mobile/src/providers/session-provider.tsx \
            apps/mobile/test/secure-storage.test.ts \
            apps/mobile/test/session-bootstrap.test.ts \
            apps/mobile/test/startup-recovery.test.tsx \
            docs/release/ANDROID_STARTUP_RECOVERY.md \
            packages/i18n/src/index.ts
          git commit -m "style: format Android startup hotfix"
          git push origin HEAD:codex/fix-android-startup-loading
