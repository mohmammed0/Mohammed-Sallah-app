name: Monitor EAS Preview RC.2 Build

on:
  push:
    branches:
      - codex/eas-build-monitor-rc2

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out monitor branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile

      - name: Set up read-only EAS CLI session
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385
        with:
          eas-version: 22.0.0
          packager: pnpm --allow-build=dtrace-provider
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish sanitized RC.2 status to Issue #12
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$RUNNER_TEMP/github-runs.json"
          builds_json="$RUNNER_TEMP/eas-builds.json"
          report="$RUNNER_TEMP/report.md"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs?branch=codex/eas-android-preview-build-rc2&event=push&per_page=20" \
            > "$runs_json"

          cd apps/mobile
          eas build:list --platform android --build-profile preview --limit 10 --json --non-interactive > "$builds_json"
          cd ../..

          RUNS_JSON="$runs_json" BUILDS_JSON="$builds_json" REPORT="$report" node <<'NODE'
          const fs = require('node:fs');
          const runPayload = JSON.parse(fs.readFileSync(process.env.RUNS_JSON, 'utf8'));
          const buildPayload = JSON.parse(fs.readFileSync(process.env.BUILDS_JSON, 'utf8'));
          const target = 'd20ad26ece96adc50638a6f16a403439bca87eab';

          const runs = (runPayload.workflow_runs ?? [])
            .filter((run) => run.name === 'EAS Android Preview RC.2 — Approved One-Time')
            .map((run) => ({
              id: run.id,
              url: run.html_url,
              headSha: run.head_sha,
              status: run.status,
              conclusion: run.conclusion,
              updatedAt: run.updated_at,
            }))
            .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));

          const builds = (Array.isArray(buildPayload) ? buildPayload : [])
            .map((build) => ({
              id: build.id,
              status: build.status,
              profile: build.buildProfile ?? build.profile ?? null,
              gitCommitHash: build.gitCommitHash ?? build?.gitCommit?.hash ?? null,
              createdAt: build.createdAt,
              updatedAt: build.updatedAt,
              url:
                build.buildDetailsPageUrl ??
                build.url ??
                `https://expo.dev/accounts/binmuhayas-team/projects/sallah/builds/${build.id}`,
            }))
            .filter((build) => build.gitCommitHash === target)
            .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));

          const lines = [
            '## EAS Android Preview RC.2 status monitor',
            '',
            '### GitHub Actions',
          ];
          if (runs.length === 0) lines.push('- No matching RC.2 workflow run exists yet.');
          for (const run of runs.slice(0, 5)) {
            lines.push(`- [Run ${run.id}](${run.url}) — \`${run.status}\` / \`${run.conclusion ?? 'pending'}\`; workflow head \`${run.headSha}\`; updated \`${run.updatedAt}\``);
          }
          lines.push('', '### Expo EAS builds');
          if (builds.length === 0) {
            lines.push(`- No Android Preview build is yet associated with source \`${target}\`.`);
          } else {
            for (const build of builds.slice(0, 5)) {
              lines.push(`- [Build ${build.id}](${build.url}) — status \`${build.status}\`; profile \`${build.profile ?? 'unknown'}\`; source \`${build.gitCommitHash}\`; updated \`${build.updatedAt ?? 'not reported'}\``);
            }
          }
          lines.push('', '_Read-only monitor: it did not start, modify, cancel, or submit a build._');
          fs.writeFileSync(process.env.REPORT, `${lines.join('\n')}\n`);
          NODE

          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body-file "$report"
