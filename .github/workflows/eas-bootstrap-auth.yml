name: EAS bootstrap authentication

on:
  push:
    branches:
      - codex/eas-preview-bootstrap

permissions:
  contents: read

concurrency:
  group: eas-bootstrap-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-bootstrap:
    name: Authenticate and inspect EAS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact bootstrap commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install frozen dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify EXPO_TOKEN presence
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo "::error::EXPO_TOKEN repository secret is not configured"
            exit 1
          fi
          echo "EXPO_TOKEN is configured; its value was not displayed."

      - name: Set up authenticated EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          packager: pnpm --allow-build=dtrace-provider
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Authenticate, initialize safely, and inspect usage
        id: eas
        shell: bash
        run: |
          set -euo pipefail

          run_eas() {
            case "${1:-}" in
              whoami|init|account:usage|config)
                command eas "$@"
                ;;
              *)
                echo "::error::EAS operation is outside the auth-only allowlist"
                return 64
                ;;
            esac
          }

          mobile_dir="$GITHUB_WORKSPACE/apps/mobile"
          original_config="$mobile_dir/app.config.ts"
          static_config="$mobile_dir/app.json"
          backup_config="$RUNNER_TEMP/app.config.ts.bootstrap"
          before_config="$RUNNER_TEMP/expo-config-before.json"
          init_json="$RUNNER_TEMP/eas-init.json"
          usage_json="$RUNNER_TEMP/eas-account-usage.json"
          eas_config_json="$RUNNER_TEMP/eas-preview-config.json"
          sanitized_json="$RUNNER_TEMP/eas-bootstrap-sanitized.json"

          if [[ ! -f "$original_config" || -e "$static_config" ]]; then
            echo "::error::Unexpected Expo configuration layout"
            exit 1
          fi

          owner_output="$(
            cd "$mobile_dir"
            run_eas whoami
          )"
          owner="$(
            WHOAMI_OUTPUT="$owner_output" node <<'NODE'
          const output = (process.env.WHOAMI_OUTPUT ?? '')
            .replace(/\u001b\[[0-9;]*m/g, '')
            .replace(/\r/g, '');
          const accountMatches = [
            ...output.matchAll(/^•\s+([A-Za-z0-9._-]+)\s+\(Role:\s*[^)]+\)$/gm),
          ].map((match) => match[1]);

          let owner;
          if (accountMatches.length === 1) {
            owner = accountMatches[0];
          } else if (accountMatches.length > 1) {
            throw new Error('Authenticated robot has access to multiple Expo accounts');
          } else {
            const firstLine = output
              .split('\n')
              .map((line) => line.trim())
              .find(Boolean);
            if (!firstLine || firstLine.includes('(robot)')) {
              throw new Error('Expo account owner is ambiguous');
            }
            owner = firstLine.replace(/\s+\(authenticated using EXPO_TOKEN\)$/, '');
          }

          if (!/^[A-Za-z0-9._-]+$/.test(owner)) {
            throw new Error('Expo account owner has an unsupported format');
          }
          process.stdout.write(owner);
          NODE
          )"

          expo_binary="$mobile_dir/node_modules/.bin/expo"
          if [[ ! -x "$expo_binary" ]]; then
            echo "::error::Local Expo CLI binary is unavailable after frozen install"
            exit 1
          fi
          (
            cd "$mobile_dir"
            "$expo_binary" config --type public --json
          ) > "$before_config"

          current_project_id="$(
            node - "$before_config" <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(config?.extra?.eas?.projectId ?? '');
          NODE
          )"

          current_owner="$(
            node - "$before_config" <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(config?.owner ?? '');
          NODE
          )"

          if [[ -n "$current_owner" && "$current_owner" != "$owner" ]]; then
            echo "::error::Configured Expo owner differs from the authenticated owner"
            exit 1
          fi

          restore_dynamic_config() {
            rm -f "$static_config"
            if [[ -f "$backup_config" ]]; then
              mv "$backup_config" "$original_config"
            fi
          }
          trap restore_dynamic_config EXIT

          mv "$original_config" "$backup_config"
          STATIC_CONFIG="$static_config" BOOTSTRAP_OWNER="$owner" BOOTSTRAP_PROJECT_ID="$current_project_id" \
            node <<'NODE'
          const fs = require('node:fs');
          const projectId = process.env.BOOTSTRAP_PROJECT_ID;
          const expo = {
            name: 'Sallah',
            slug: 'sallah',
            owner: process.env.BOOTSTRAP_OWNER,
            ...(projectId ? { extra: { eas: { projectId } } } : {}),
          };
          fs.writeFileSync(process.env.STATIC_CONFIG, `${JSON.stringify({ expo }, null, 2)}\n`, {
            mode: 0o600,
          });
          NODE

          if [[ -n "$current_project_id" ]]; then
            (
              cd "$mobile_dir"
              run_eas init --id "$current_project_id" --force --json --non-interactive --no-icon
            ) > "$init_json"
          else
            (
              cd "$mobile_dir"
              run_eas init --account "$owner" --force --json --non-interactive --no-icon
            ) > "$init_json"
          fi

          restore_dynamic_config
          trap - EXIT

          IFS=$'\t' read -r project_status project_id project_owner project_slug project_url < <(
            node - "$init_json" "$owner" <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expectedOwner = process.argv[3];
          const allowedStatuses = new Set(['created', 'linked', 'already-linked']);
          if (
            !allowedStatuses.has(result.status) ||
            typeof result.projectId !== 'string' ||
            !/^[0-9a-f-]{36}$/i.test(result.projectId) ||
            result.owner !== expectedOwner ||
            result.slug !== 'sallah' ||
            typeof result.dashboardUrl !== 'string' ||
            !result.dashboardUrl.startsWith('https://expo.dev/accounts/')
          ) {
            throw new Error('EAS initialization returned unexpected or ambiguous project data');
          }
          process.stdout.write(
            [result.status, result.projectId, result.owner, result.slug, result.dashboardUrl].join('\t'),
          );
          NODE
          )

          (
            cd "$mobile_dir"
            run_eas account:usage "$project_owner" --json --non-interactive
          ) > "$usage_json"

          (
            cd "$mobile_dir"
            export EAS_PROJECT_ID="$project_id"
            export EXPO_PUBLIC_APP_ENV=preview
            export SALLAH_ANDROID_PACKAGE=com.mohmammed0.sallah.preview
            export SALLAH_IOS_BUNDLE_ID=com.mohmammed0.sallah.preview
            run_eas config --platform android --profile preview --json --non-interactive
          ) > "$eas_config_json"

          INIT_JSON="$init_json" USAGE_JSON="$usage_json" EAS_CONFIG_JSON="$eas_config_json" \
            SANITIZED_JSON="$sanitized_json" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" node <<'NODE'
          const fs = require('node:fs');
          const init = JSON.parse(fs.readFileSync(process.env.INIT_JSON, 'utf8'));
          const usage = JSON.parse(fs.readFileSync(process.env.USAGE_JSON, 'utf8'));
          const easConfig = JSON.parse(fs.readFileSync(process.env.EAS_CONFIG_JSON, 'utf8'));

          const androidPlan = usage?.builds?.android?.plan ?? null;
          const androidUsed = Number.isFinite(androidPlan?.used) ? androidPlan.used : null;
          const androidLimit = Number.isFinite(androidPlan?.limit) ? androidPlan.limit : null;
          const androidRemaining =
            androidUsed !== null && androidLimit !== null
              ? Math.max(0, androidLimit - androidUsed)
              : null;
          const nextBuildCost =
            androidRemaining !== null && androidRemaining > 0
              ? '$0 EXPECTED'
              : 'COST NOT PROVEN — BUILD REMAINS BLOCKED';

          const appConfig = easConfig?.appConfig;
          const buildProfile = easConfig?.buildProfile;
          if (
            appConfig?.extra?.eas?.projectId !== init.projectId ||
            appConfig?.android?.package !== 'com.mohmammed0.sallah.preview' ||
            buildProfile?.distribution !== 'internal' ||
            buildProfile?.channel !== 'preview' ||
            buildProfile?.env?.EXPO_PUBLIC_APP_ENV !== 'preview'
          ) {
            throw new Error('Resolved preview EAS configuration did not match the safe bootstrap inputs');
          }

          const sanitized = {
            authentication: 'PASS',
            owner: init.owner,
            project: {
              status: init.status,
              slug: init.slug,
              projectId: init.projectId,
              dashboardUrl: init.dashboardUrl,
            },
            costGate: {
              plan: usage?.account?.plan ?? 'unknown',
              billingPeriod: {
                start: usage?.account?.billingPeriod?.start ?? null,
                end: usage?.account?.billingPeriod?.end ?? null,
              },
              android: {
                used: androidUsed,
                limit: androidLimit,
                remainingIncluded: androidRemaining,
              },
              usageBasedBilling: 'not explicitly reported by EAS CLI account:usage JSON',
              expectedNextBuildCost: nextBuildCost,
              evidence: 'eas account:usage --json --non-interactive',
            },
            previewResolution: {
              androidPackage: appConfig.android.package,
              projectId: appConfig.extra.eas.projectId,
              distribution: buildProfile.distribution,
              channel: buildProfile.channel,
              appEnvironment: buildProfile.env.EXPO_PUBLIC_APP_ENV,
            },
            safety: {
              commandAllowlist: ['whoami', 'init', 'account:usage', 'config'],
              buildStarted: false,
              updateStarted: false,
              deploymentStarted: false,
              credentialsConfigured: false,
            },
          };

          fs.writeFileSync(process.env.SANITIZED_JSON, `${JSON.stringify(sanitized, null, 2)}\n`, {
            mode: 0o600,
          });

          const summary = [
            '## EAS bootstrap authentication',
            '',
            `- Authentication: ${sanitized.authentication}`,
            `- Owner: \`${sanitized.owner}\``,
            `- Project: \`${sanitized.project.status}\``,
            `- Slug: \`${sanitized.project.slug}\``,
            `- Project ID: \`${sanitized.project.projectId}\``,
            `- Dashboard: ${sanitized.project.dashboardUrl}`,
            `- Plan: \`${sanitized.costGate.plan}\``,
            `- Android usage: \`${androidUsed ?? 'not reported'} / ${androidLimit ?? 'not reported'}\``,
            `- Remaining included Android capacity: \`${androidRemaining ?? 'not reported'}\``,
            `- Next build cost: **${nextBuildCost}**`,
            '- EAS build/update/deploy/credentials operations: **NOT RUN**',
            '- Token value: **NOT DISPLAYED**',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(`SANITIZED_EAS_BOOTSTRAP_RESULT=${JSON.stringify(sanitized)}`);
          NODE

          echo "sanitized_path=$sanitized_json" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized bootstrap evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eas-bootstrap-sanitized-${{ github.sha }}
          path: ${{ steps.eas.outputs.sanitized_path }}
          if-no-files-found: error
          retention-days: 7
