version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Align SDK/runtime updates together using Expo's compatibility check.
    # SemVer ignore rules affect version updates only; security updates remain eligible.
    # See docs/oss/OSS_INVENTORY.md for the review and validation procedure.
    ignore:
      - dependency-name: expo
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: expo-*
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-dom
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-test-renderer
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@types/react-test-renderer'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@react-native-async-storage/async-storage'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-native
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-native-maps
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-native-safe-area-context
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-native-screens
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-native-svg
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-native-worklets
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      safe-minor-patches:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
